<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Тур ПЭВМ - Динамический загрузчик (JSON/CSV)</title>
    <style>
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; background: #111; font-family: sans-serif;
            user-select: none;
        }

        /* Панель навигации (Шапка) */
        #nav-header {
            position: absolute; top: 0; left: 0; width: 100%; height: 50px;
            background: #1a1a1a; border-bottom: 2px solid #333;
            display: flex; align-items: center; justify-content: space-between;
            box-sizing: border-box; padding: 0 20px; z-index: 100;
        }
        .project-select-block { color: #fff; display: flex; align-items: center; gap: 10px; }
        select {
            padding: 6px 10px; background: #2a2a2a; color: #fff; border: 1px solid #555;
            border-radius: 4px; cursor: pointer; outline: none; font-size: 13px;
        }
        select:hover { border-color: #777; }
        
        .tabs-group { display: flex; gap: 5px; height: 100%; align-items: flex-end; }
        .tab-btn {
            background: #2a2a2a; color: #aaa; border: 1px solid #333; border-bottom: none;
            padding: 8px 20px; font-weight: bold; cursor: pointer; border-radius: 6px 6px 0 0;
            transition: all 0.2s; font-size: 14px; outline: none;
        }
        .tab-btn:hover { color: #fff; background: #333; }
        .tab-btn.active { background: #00ffcc; color: #111; border-color: #00ffcc; }

        /* Контейнер под шапкой */
        .content-container {
            position: absolute; top: 50px; left: 0; width: 100%; height: calc(100% - 50px);
        }

        /* Вкладка 1: Панорама */
        #tab-pano-content {
            width: 100%; height: 100%; position: absolute; z-index: 2;
        }

        /* Вкладка 2: Миникарта */
        #tab-map-content {
            display: none; width: 100%; height: 100%; position: absolute;
            background: #161616; z-index: 1;
        }
        
        #map-wrapper {
            width: 85vmin; height: 85vmin; max-width: 750px; max-height: 750px;
            background: #090909; border: 2px solid #444; border-radius: 50%;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); overflow: hidden;
        }
        #map-points { width: 100%; height: 100%; position: relative; }
        
        /* Маркеры сканов на карте */
        .map-dot {
            position: absolute; width: 14px; height: 14px;
            background: #fff; border: 3px solid #222; border-radius: 50%;
            cursor: pointer; transform: translate(-50%, -50%); z-index: 5;
            transition: background-color 0.3s, transform 0.2s;
        }
        .map-dot:hover { background: #00ffcc; transform: translate(-50%, -50%) scale(1.3); }
        .map-dot.active {
            background: #ff3366; border-color: #fff; box-shadow: 0 0 15px #ff3366; z-index: 6;
        }

        /* Векторный конус радара взгляда */
        #map-radar {
            position: absolute; width: 0; height: 0;
            border-left: 45px solid transparent; border-right: 45px solid transparent;
            border-top: 90px solid rgba(0, 255, 204, 0.35);
            transform-origin: 50% 0%; pointer-events: none; z-index: 4; display: none;
        }
    </style>
    <script src="krpano.js"></script>
    <script src="js/tour-loader.js"></script>
</head>
<body>

    <div id="nav-header">
        <div class="project-select-block">
            <span>Выберите объект сканирования:</span>
            <select id="project-selector">
                <option value="">-- Список объектов --</option>
            </select>
        </div>
        <div class="tabs-group">
            <button id="btn-tab-pano" class="tab-btn active" onclick="switchTab('pano')">1. Вид панорамы 360°</button>
            <button id="btn-tab-map" class="tab-btn" onclick="switchTab('map')">2. Интерактивная 2D-Карта</button>
        </div>
    </div>

    <div class="content-container">
        <!-- Окно панорамы -->
        <div id="tab-pano-content">
            <div id="pano" style="width:100%; height:100%;"></div>
        </div>

        <!-- Окно миникарты -->
        <div id="tab-map-content">
            <div id="map-wrapper">
                <div id="map-points"></div>
            </div>
        </div>
    </div>

</body>
</html>
