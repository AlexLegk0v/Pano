<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панорамный Проект (krpano + OpenLayers)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.3.1/ol.css" type="text/css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="main-container">
    <div id="top-controls">
        <button class="btn" id="open-project-btn">📁 Выбрать проект</button>
        <button class="btn active" id="mode-pano-btn">🌐 Панорама</button>
        <button class="btn" id="mode-map-btn">🗺️ Карта WMS</button>
    </div>

    <div id="pano-viewer" class="view-mode active">
        <div id="krpano-div"></div>
        <div id="pano-loader" class="pano-loader-container">
            <div class="pano-loader-card">
                <div class="pano-loader-title">Загрузка панорамы...</div>
                <div class="progress-bar-bg">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
                <div id="progress-text" class="progress-text">0%</div>
            </div>
        </div>
    </div>

    <div id="map-viewer" class="view-mode">
        <div id="map-div"></div>
    </div>

    <div id="map-loader" class="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text">Загрузка карты GeoServer...</div>
    </div>

    <div id="scene-selector-panel"></div>
</div>

<div id="project-modal-overlay">
    <div id="project-modal">
        <div class="modal-header">
            <h3>Выбор проекта</h3>
            <button class="close-modal-btn" id="close-modal-btn">&times;</button>
        </div>
        <div class="modal-body">
            <div class="search-filter-box">
                <select id="filter-region" class="filter-select">
                    <option value="all">Все регионы</option>
                    <option value="center">Центр</option>
                    <option value="north">Север</option>
                </select>
            </div>
            <div class="project-list" id="project-list-container"></div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.0.1/math.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol@v10.3.1/dist/ol.js"></script>
<script src="krpano.js"></script>
<script src="app.js"></script>
</body>
</html>
