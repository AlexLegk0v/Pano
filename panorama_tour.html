<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панорамы Lixel — Krpano Tour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; overflow: hidden; }

  #layout { display: flex; width: 100vw; height: 100vh; }

  /* --- Левая панель --- */
  #sidebar {
    width: 340px; min-width: 340px;
    background: #16213e; display: flex; flex-direction: column;
    border-right: 1px solid #0f3460; overflow: hidden;
  }
  #sidebar-header { padding: 14px 16px; background: #0f3460; }
  #sidebar-header h1 { font-size: 16px; font-weight: 600; color: #e0e0e0; }
  #sidebar-header p { font-size: 11px; color: #8ea3c0; margin-top: 3px; }

  /* Инфо */
  #info-panel { padding: 10px 16px; background: #1a1a2e; border-bottom: 1px solid #0f3460; font-size: 12px; }
  #info-panel .info-row { display: flex; justify-content: space-between; padding: 2px 0; }
  #info-panel .info-label { color: #8ea3c0; }
  #info-panel .info-value { color: #e94560; font-weight: 600; font-family: "Courier New", monospace; }

  /* Мини-карта */
  #minimap-container { padding: 10px 16px; border-bottom: 1px solid #0f3460; }
  #minimap-container h2 { font-size: 12px; color: #8ea3c0; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  #minimap { background: #0d1b2a; border: 1px solid #0f3460; border-radius: 4px; cursor: crosshair; display: block; }

  /* Список панорам */
  #pano-list-container { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  #pano-list-container h2 { font-size: 12px; color: #8ea3c0; padding: 10px 16px 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  #pano-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  #pano-list::-webkit-scrollbar { width: 6px; }
  #pano-list::-webkit-scrollbar-track { background: #0d1b2a; }
  #pano-list::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

  .pano-item {
    padding: 8px 10px; margin: 2px 0; background: #1a1a2e; border-radius: 4px;
    cursor: pointer; font-size: 12px; transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .pano-item:hover { background: #0f3460; }
  .pano-item.active { background: #0f3460; border-left-color: #e94560; }
  .pano-item .filename { color: #e0e0e0; font-weight: 500; word-break: break-all; }
  .pano-item .coords { color: #8ea3c0; font-size: 10px; margin-top: 2px; font-family: "Courier New", monospace; }
  .pano-item .dist { color: #e94560; font-size: 10px; font-weight: 600; }

  /* Кнопки */
  #nav-buttons { padding: 10px 16px; display: flex; gap: 8px; border-top: 1px solid #0f3460; }
  #nav-buttons button {
    flex: 1; padding: 8px; background: #0f3460; color: #e0e0e0; border: none;
    border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; transition: background 0.15s;
  }
  #nav-buttons button:hover { background: #e94560; }
  #nav-buttons button:disabled { opacity: 0.4; cursor: default; }
  #nav-buttons button:disabled:hover { background: #0f3460; }

  /* --- Зона krpano --- */
  #pano-container { flex: 1; position: relative; background: #000; }
  #krpano { width: 100%; height: 100%; }

  /* Статус */
  #status {
    position: absolute; bottom: 10px; left: 10px; right: 10px;
    background: rgba(15,52,96,0.85); color: #e0e0e0; padding: 6px 12px;
    border-radius: 4px; font-size: 11px; font-family: "Courier New", monospace;
    pointer-events: none; z-index: 10; display: none;
  }
</style>
</head>
<body>
<div id="layout">

  <!-- Левая панель -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Lixel Panorama Tour</h1>
      <p>Krpano 1.19-pr16 · <span id="pano-count">0</span> панорам</p>
    </div>

    <div id="info-panel">
      <div class="info-row"><span class="info-label">Файл:</span><span class="info-value" id="cur-filename">—</span></div>
      <div class="info-row"><span class="info-label">X:</span><span class="info-value" id="cur-x">—</span></div>
      <div class="info-row"><span class="info-label">Y:</span><span class="info-value" id="cur-y">—</span></div>
      <div class="info-row"><span class="info-label">Z:</span><span class="info-value" id="cur-z">—</span></div>
      <div class="info-row"><span class="info-label">Yaw:</span><span class="info-value" id="cur-yaw">—</span></div>
    </div>

    <div id="minimap-container">
      <h2>Карта точек</h2>
      <canvas id="minimap" width="308" height="308"></canvas>
    </div>

    <div id="pano-list-container">
      <h2>Панорамы</h2>
      <div id="pano-list"></div>
    </div>

    <div id="nav-buttons">
      <button id="btn-prev" onclick="navigatePrev()">← Назад</button>
      <button id="btn-next" onclick="navigateNext()">Вперёд →</button>
    </div>
  </div>

  <!-- Зона krpano -->
  <div id="pano-container">
    <div id="krpano"></div>
    <div id="status"></div>
  </div>

</div>

<!-- krpano движок (ваш файл) -->
<script src="krpano.js"></script>

<!-- Данные панорам -->
<script src="tour_config.js"></script>

<!-- Логика -->
<script src="app.js"></script>
</body>
</html>
